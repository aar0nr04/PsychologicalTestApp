// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google() // Repositorio de Google
        mavenCentral() // Repositorio central de Maven
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2' // Plugin de Firebase
        //compile 'com.google.code.gson:gson:2.10.1' // Use the latest version
    }
}

plugins {
    id 'com.android.application' version '8.9.2' apply false
    id 'com.android.library' version '8.9.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id("com.google.gms.google-services") version "4.4.0" apply false

    //id 'kotlin-kapt' // Enable kapt for annotation processing
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

